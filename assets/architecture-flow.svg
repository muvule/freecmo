    <circle cx="22" cy="24" r="5" fill="#4E8C75"/>
    <text x="36" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1" fill="#B7C0BC">04 · QA &amp; GATE</text>
