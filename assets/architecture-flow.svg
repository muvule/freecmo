  <line x1="36" y1="56" x2="924" y2="56" stroke="#E4E2DC" stroke-width="1"/>

  <!-- Card 1: Composer -->
  <g transform="translate(36, 78)">
    <rect x="0" y="0" width="196" height="166" rx="14" fill="#FFFFFF" stroke="#E0DDD5" stroke-width="1.2"/>
    <circle cx="22" cy="24" r="5" fill="#18201E"/>
    <text x="36" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1" fill="#5E6662">01 · COMPOSER</text>
    <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="600" fill="#18201E">Human Sets Score</text>
    <text x="18" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#525A56">/cmo init &amp; strategy lock</text>
    <text x="18" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#525A56">Weekly Brief (max 5 items)</text>
    <text x="18" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#525A56">/cmo run-with-this drop-in</text>
    <rect x="18" y="140" width="120" height="16" rx="8" fill="#F1F0EC"/>
    <text x="27" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#2F5D50">status: locked</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="238" y1="161" x2="264" y2="161" stroke="#9AA19D" stroke-width="1.5"/>
