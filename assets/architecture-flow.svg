<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="FreeCMO Composer to Orchestrator to Ephemeral Subtask Architecture">
  <rect x="2" y="2" width="956" height="276" rx="20" fill="#F8F7F4" stroke="#E4E2DC" stroke-width="1.5"/>

