  <!-- Card 2: Orchestrator -->
  <g transform="translate(274, 78)">
    <rect x="0" y="0" width="196" height="166" rx="14" fill="#FFFFFF" stroke="#E0DDD5" stroke-width="1.2"/>
    <circle cx="22" cy="24" r="5" fill="#2F5D50"/>
    <text x="36" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1" fill="#5E6662">02 · ORCHESTRATOR</text>
    <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="600" fill="#18201E">Cross-Channel Brain</text>
    <text x="18" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#525A56">Acq vs. Retention ROI</text>
    <text x="18" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#525A56">Paid &lt;-&gt; SEO &amp; GEO gaps</text>
    <text x="18" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#525A56">Stop-loss &amp; disproof kill</text>
